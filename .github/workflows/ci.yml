# Intégration continue.
#
# Le point important est en bas : les DSN de test sont **vérifiés présents**
# plutôt que laissés absents. Une suite d'isolation silencieusement sautée est
# indiscernable d'une suite d'isolation qui passe, et c'est exactement la
# confusion que ce produit ne peut pas se permettre.

name: CI

on:
  workflow_dispatch
jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostGIS seul : `pgvector` est devenu facultatif (décision 0021), et
        # l'étape d'installation par `apt` qui suivait ici a disparu avec lui.
        # Une étape de CI qui dépend d'un dépôt Debian joignable est une étape
        # qui tombera un jour sans que le code ait changé.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      ATLAS_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/atlas
      ATLAS_TEST_DATABASE_URL: postgresql+asyncpg://atlas_app:atlas_app@127.0.0.1:5432/atlas
      ATLAS_TEST_ANALYTICS_DATABASE_URL: postgresql+asyncpg://atlas_analytics_ro:atlas_analytics_ro@127.0.0.1:5432/atlas
      ATLAS_TEST_OWNER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/atlas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Give the test roles a password
        # Par la commande du produit, et non par un `psql` parallèle : c'est
        # celle qu'un opérateur lance en production, et la faire tourner ici est
        # la seule façon de savoir qu'elle marche encore.
        working-directory: backend
        env:
          ATLAS_APP_ROLE_PASSWORD: atlas_app
          ATLAS_ANALYTICS_ROLE_PASSWORD: atlas_analytics_ro
        run: python -m app.cli set-role-passwords

      - name: Refuse to run the suite without the isolation DSNs
        # Sans ces variables, la suite d'isolation échoue au lieu d'être sautée
        # — mais elle ne peut le faire que si l'on arrive jusqu'à elle. Ce
        # contrôle attrape le cas où le service de base de données n'a pas
        # démarré du tout.
        run: |
          test -n "$ATLAS_TEST_DATABASE_URL"           || { echo "app DSN unset" >&2; exit 1; }
          test -n "$ATLAS_TEST_ANALYTICS_DATABASE_URL" || { echo "analytics DSN unset" >&2; exit 1; }
          test -n "$ATLAS_TEST_OWNER_DATABASE_URL"     || { echo "owner DSN unset" >&2; exit 1; }

      - name: Test
        working-directory: backend
        run: pytest -q -ra

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  # La pile complète, construite et démarrée jusqu'à une recommandation servie.
  # C'est ce qui empêche la phase 8 de se défaire en silence : un point d'entrée
  # renommé, une commande de semis qui cesse d'être rejouable, un rôle sans mot
  # de passe — rien de tout cela n'apparaît dans une suite de tests.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)")
            [ "$state" = "healthy" ] && exit 0
            [ "$state" = "unhealthy" ] && break
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Serve a real recommendation
        run: |
          token=$(curl -sS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"agronome@souss-primeurs.ma","password":"demo-souss-primeurs-2026"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -sS -f "http://127.0.0.1:8000/api/v1/parcelles/P03/irrigation" \
            -H "Authorization: Bearer $token" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["headline_fr"]); assert d["et0_mm_day"]'

      - name: The stack restarts without failing on its own seed
        # Le semis est rejouable, et cette étape est la seule qui le prouve :
        # la première exécution ne rencontre jamais le cas.
        run: |
          docker compose up -d
          docker compose logs seed | tail -5

      - name: Back up and restore into an empty database
        run: |
          docker compose exec -T db pg_dumpall -U postgres --roles-only --no-role-passwords > roles.sql
          docker compose exec -T db pg_dump -U postgres --dbname=atlas --format=custom > atlas.dump
          docker compose exec -T db psql -U postgres -c 'CREATE DATABASE atlas_restore'
          docker compose exec -T db psql -U postgres -d atlas_restore -f - < roles.sql || true
          docker compose exec -T db pg_restore -U postgres --dbname=atlas_restore --exit-on-error < atlas.dump
          docker compose exec -T db psql -U postgres -d atlas_restore -Atc "
            SELECT CASE WHEN count(*) = 16 THEN 'force-rls ok'
                        ELSE 'force-rls LOST: ' || count(*) END
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'app' AND c.relforcerowsecurity" | grep 'force-rls ok'

      - name: Stop
        if: always()
        run: docker compose down -v